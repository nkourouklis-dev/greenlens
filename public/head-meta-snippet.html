<!-- ============================================================ -->
<!-- GreenLens — Meta tags για SEO, Open Graph & Twitter Cards      -->
<!-- Πρόσθεσέ το μέσα στο <head> του index.html (ή via react-helmet) -->
<!-- ============================================================ -->

<!-- Βασικά -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GreenLens — Δες τι πραγματικά αγοράζεις</title>
<meta name="description" content="Φωτογράφισε μια ετικέτα και το GreenLens σου δείχνει αμέσως συστατικά, αλλεργιογόνα και κρυφούς κινδύνους. Έξυπνες αγορές, χωρίς ψιλά γράμματα." />
<meta name="theme-color" content="#10B981" />
<link rel="canonical" href="https://greenlens.app/" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="GreenLens" />
<meta property="og:url" content="https://greenlens.app/" />
<meta property="og:title" content="GreenLens — Σάρωσε την ετικέτα. Μάθε τι αγοράζεις." />
<meta property="og:description" content="AI ανάλυση συστατικών σε δευτερόλεπτα. Εντόπισε αλλεργιογόνα, κατανόησε τις ετικέτες και αγόρασε με σιγουριά — για σένα και την οικογένειά σου." />
<meta property="og:image" content="https://greenlens.app/og/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Το λογότυπο GreenLens πάνω σε σκούρο φόντο, με τη φράση: Σάρωσε την ετικέτα. Μάθε τι αγοράζεις." />
<meta property="og:locale" content="el_GR" />

<!-- Twitter / X Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="GreenLens — Σάρωσε την ετικέτα. Μάθε τι αγοράζεις." />
<meta name="twitter:description" content="Φωτογράφισε οποιαδήποτε ετικέτα και δες αμέσως συστατικά, αλλεργιογόνα και ό,τι κρύβεται στα ψιλά γράμματα. Δωρεάν, γρήγορο, χωρίς εγκατάσταση." />
<meta name="twitter:image" content="https://greenlens.app/og/og-image.png" />
<meta name="twitter:image:alt" content="Το λογότυπο GreenLens πάνω σε σκούρο φόντο, με τη φράση: Σάρωσε την ετικέτα. Μάθε τι αγοράζεις." />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GreenLens" />

<!-- Robots -->
<meta name="robots" content="index, follow" />
